<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Sistem Absensi Hybrid</title>
    <link rel="stylesheet" href="../static/css/style.css">
</head>

<body>
    <div class="center-layout">
        <div class="card">
            <h1 class="card-title">Portal Absensi</h1>
            <p class="card-subtitle">Silakan login untuk mengakses sistem</p>

            {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
            <div class="flash-messages">
                {% for category, message in messages %}
                <div class="alert alert-{{ category }}">{{ message }}</div>
                {% endfor %}
            </div>
            {% endif %}
            {% endwith %}

            <form id="login-form" action="/login" method="POST">
                <div class="form-group">
                    <label class="form-label" for="email">Email Akademik</label>
                    <input type="email" id="email" name="email" class="form-control" placeholder="nim@mahasiswa.edu"
                        required>
                </div>

                <div class="form-group">
                    <label class="form-label" for="password">Password</label>
                    <input type="password" id="password" name="password" class="form-control" placeholder="********"
                        required>
                </div>

                <div class="form-group">
                    <label class="form-label" for="role">Masuk Sebagai</label>
                    <select id="role" name="role" class="form-control" required>
                        <option value="mahasiswa">Mahasiswa</option>
                        <option value="dosen">Dosen</option>
                    </select>
                </div>

                <button type="submit" class="btn btn-primary mt-4">Login</button>
            </form>
        </div>
    </div>
</body>

</html>
